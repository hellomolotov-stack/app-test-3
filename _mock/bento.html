<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px 14px 40px;background:linear-gradient(180deg,#22303d,#0f161d);font-family:-apple-system,Inter,system-ui,sans-serif;color:#fff}
h3{margin:24px 4px 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.plate{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;border-radius:22px;max-width:340px;
 background:linear-gradient(rgba(214,170,110,.16),rgba(214,170,110,.16)),rgba(20,28,38,.96);border:1px solid rgba(214,170,110,.45)}
.t{flex:1;min-width:0}.t b{display:block;font-size:15px;color:#F3D9B1}
.t small{display:block;font-size:12px;line-height:1.3;color:rgba(255,255,255,.62);margin-top:2px}
.btn{flex:none;border:0;border-radius:30px;padding:9px 13px;font:inherit;font-size:13px;font-weight:800;color:#000;background:linear-gradient(180deg,#e8ff4a,#c9ec00);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 12px rgba(0,0,0,.3)}
.pic{position:relative;flex:none;width:78px;height:70px}
.tray{position:absolute;inset:3px 2px;border-radius:13px;padding:4px;display:grid;gap:3px;
 background:linear-gradient(145deg,#6fcdf5,#2a8fc6);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.15),0 5px 10px rgba(0,0,0,.5)}
.cell{position:relative;border-radius:7px;background:radial-gradient(circle at 30% 25%,#ffffff,#e3f3fc);box-shadow:inset 0 1px 3px rgba(0,0,0,.28);overflow:hidden;display:flex;align-items:center;justify-content:center}
.cell img{max-width:96%;max-height:96%;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
/* 1 – ролл в длинной ячейке сверху, три ячейки снизу, палочки поверх */
.v1 .tray{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1.15fr 1fr;transform:rotate(-7deg)}
.v1 .roll{grid-column:span 3}
.v1 .roll img{max-height:150%;max-width:70%;transform:rotate(-8deg)}
.sticks{position:absolute;left:-4px;top:30px;width:86px;height:4px;border-radius:3px;background:linear-gradient(90deg,#c9ec00,#e8ff4a);transform:rotate(-30deg);box-shadow:0 2px 3px rgba(0,0,0,.45);z-index:3}
.sticks.b{top:35px;left:0;transform:rotate(-26deg)}
/* 2 – круглые ячейки (как бенто-ланчбокс), ролл слева, справа три кружка */
.v2 .tray{grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr 1fr;transform:rotate(5deg);border-radius:16px}
.v2 .roll{grid-row:span 3;border-radius:10px}
.v2 .roll img{transform:rotate(80deg);max-width:150%;max-height:150%}
.v2 .cell:not(.roll){border-radius:50px}
.leaf{position:absolute;width:12px;height:7px;background:#8fd14f;border-radius:0 8px 0 8px;z-index:3;box-shadow:0 1px 2px rgba(0,0,0,.4)}
/* 3 – бенто с крышкой, сдвинутой вбок, и жёлтой резинкой */
.v3 .lid{position:absolute;right:-6px;top:6px;width:36px;height:60px;border-radius:11px;background:linear-gradient(145deg,#8bd8f8,#3aa3da);transform:rotate(14deg);box-shadow:0 4px 8px rgba(0,0,0,.45)}
.v3 .lid::after{content:'';position:absolute;left:0;right:0;top:26px;height:6px;background:#D9FD19;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.v3 .tray{right:20px;grid-template-columns:1fr 1fr;grid-template-rows:1.2fr 1fr;transform:rotate(-6deg)}
.v3 .roll{grid-column:span 2}
.v3 .roll img{max-height:160%;transform:rotate(-6deg)}
</style></head><body>

<h3>1 · ролл сверху, три ячейки, жёлтые палочки</h3>
<div class="plate"><div class="pic v1"><div class="tray">
 <div class="cell roll"><img src="../assets/box/cut/roll.png"></div>
 <div class="cell"><img src="../assets/box/cut/cookie.png"></div>
 <div class="cell"><img src="../assets/box/cut/sticks.png"></div>
 <div class="cell"><img src="../assets/box/cut/frut.png" style="transform:rotate(80deg);max-width:150%"></div>
</div><div class="sticks"></div><div class="sticks b"></div></div>
<div class="t"><b>хайкинг бокс</b><small>еда и вода на весь хайк в одной коробке</small></div><button class="btn">что внутри</button></div>

<h3>2 · ролл слева, круглые ячейки, листик</h3>
<div class="plate"><div class="pic v2"><div class="tray">
 <div class="cell roll"><img src="../assets/box/cut/roll.png"></div>
 <div class="cell"><img src="../assets/box/cut/cookie.png"></div>
 <div class="cell"><img src="../assets/box/cut/chips.png"></div>
 <div class="cell"><img src="../assets/box/cut/sticks.png"></div>
</div><div class="leaf" style="left:10px;top:4px;transform:rotate(-20deg)"></div><div class="leaf" style="left:18px;top:2px;transform:rotate(30deg)"></div></div>
<div class="t"><b>хайкинг бокс</b><small>еда и вода на весь хайк в одной коробке</small></div><button class="btn">что внутри</button></div>

<h3>3 · крышка сдвинута, жёлтая резинка клуба</h3>
<div class="plate"><div class="pic v3"><div class="lid"></div><div class="tray">
 <div class="cell roll"><img src="../assets/box/cut/roll.png"></div>
 <div class="cell"><img src="../assets/box/cut/cookie.png"></div>
 <div class="cell"><img src="../assets/box/cut/sticks.png"></div>
</div></div>
<div class="t"><b>хайкинг бокс</b><small>еда и вода на весь хайк в одной коробке</small></div><button class="btn">что внутри</button></div>

<h3>крупно</h3>
<div style="display:flex;gap:26px;justify-content:center;transform:scale(2.2);transform-origin:top center;margin-top:10px;height:200px">
 <div class="pic v1"><div class="tray"><div class="cell roll"><img src="../assets/box/cut/roll.png"></div><div class="cell"><img src="../assets/box/cut/cookie.png"></div><div class="cell"><img src="../assets/box/cut/sticks.png"></div><div class="cell"><img src="../assets/box/cut/frut.png" style="transform:rotate(80deg);max-width:150%"></div></div><div class="sticks"></div><div class="sticks b"></div></div>
 <div class="pic v2"><div class="tray"><div class="cell roll"><img src="../assets/box/cut/roll.png"></div><div class="cell"><img src="../assets/box/cut/cookie.png"></div><div class="cell"><img src="../assets/box/cut/chips.png"></div><div class="cell"><img src="../assets/box/cut/sticks.png"></div></div><div class="leaf" style="left:10px;top:4px;transform:rotate(-20deg)"></div><div class="leaf" style="left:18px;top:2px;transform:rotate(30deg)"></div></div>
 <div class="pic v3"><div class="lid"></div><div class="tray"><div class="cell roll"><img src="../assets/box/cut/roll.png"></div><div class="cell"><img src="../assets/box/cut/cookie.png"></div><div class="cell"><img src="../assets/box/cut/sticks.png"></div></div></div>
</div>
</body></html>
