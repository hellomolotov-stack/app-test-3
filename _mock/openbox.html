<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px 14px 40px;background:linear-gradient(180deg,#22303d,#0f161d);font-family:-apple-system,Inter,system-ui,sans-serif;color:#fff}
h3{margin:22px 4px 8px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.plate{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;border-radius:22px;max-width:340px;
 background:linear-gradient(rgba(214,170,110,.16),rgba(214,170,110,.16)),rgba(20,28,38,.96);border:1px solid rgba(214,170,110,.45)}
.t{flex:1;min-width:0}.t b{display:block;font-size:15px;color:#F3D9B1}
.t small{display:block;font-size:12px;line-height:1.3;color:rgba(255,255,255,.62);margin-top:2px}
.btn{flex:none;border:0;border-radius:30px;padding:9px 13px;font:inherit;font-size:13px;font-weight:800;color:#000;background:linear-gradient(180deg,#e8ff4a,#c9ec00)}
.pic{position:relative;flex:none;width:80px;height:72px}
.pic img{position:absolute;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
/* A – открытая коробка спереди, продукты горкой (как на референсе) */
.inner{position:absolute;left:6px;right:6px;top:30px;height:16px;background:linear-gradient(180deg,#9c7240,#b98a52);border-radius:2px;transform:perspective(60px) rotateX(30deg)}
.front{position:absolute;left:3px;right:3px;bottom:2px;height:30px;z-index:20;border-radius:2px 2px 5px 5px;
 background:linear-gradient(180deg,#e2b980,#c99a60);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.5)}
.front::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:#f0cf9f;border-radius:2px}
/* B – вид сверху: стенки коробки, продукты внутри */
.top{position:absolute;inset:4px 4px 2px;border-radius:5px;transform:rotate(-6deg);
 background:#8a6236;box-shadow:0 5px 10px rgba(0,0,0,.5);border:5px solid #d6a96e;border-top-color:#e8c08a;border-left-color:#e0b67e;border-bottom-color:#c4955c;border-right-color:#c99a60;overflow:hidden}
.top img{filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
/* бирка с именем */
.tag{position:absolute;right:-8px;bottom:-2px;z-index:30;padding:4px 7px 3px 9px;border-radius:3px 6px 6px 3px;background:#fffaf0;color:#1a1a1a;
 font:700 14px/1 Caveat,cursive;transform:rotate(-9deg);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.tag::before{content:'';position:absolute;left:3px;top:50%;width:3px;height:3px;margin-top:-1.5px;border-radius:50%;background:#c9b48f}
.tag::after{content:'';position:absolute;left:-9px;top:45%;width:10px;height:1.5px;background:#d4b483;transform:rotate(-20deg)}
.tag i{display:block;font-style:normal;font:600 9px/1 -apple-system,sans-serif;color:#8a7a5c;margin-bottom:1px}
.big{transform:scale(2.6);transform-origin:top left;margin:10px 0 130px 40px;display:flex;gap:30px}
</style></head><body>

<h3>A · открытая коробка, продукты горкой</h3>
<div class="plate"><div class="pic">
 <div class="inner"></div>
 <img src="../assets/box/cut/water.png" style="height:44px;left:10px;top:0;transform:rotate(-6deg);z-index:2">
 <img src="../assets/box/cut/shake.png" style="height:42px;left:50px;top:2px;transform:rotate(7deg);z-index:2">
 <img src="../assets/box/cut/chips.png" style="height:36px;left:26px;top:6px;transform:rotate(-3deg);z-index:3">
 <img src="../assets/box/cut/roll.png" style="width:34px;left:6px;top:22px;transform:rotate(-14deg);z-index:5">
 <img src="../assets/box/cut/sticks.png" style="height:32px;left:44px;top:16px;transform:rotate(8deg);z-index:4">
 <img src="../assets/box/cut/bar.png" style="width:42px;left:20px;top:30px;transform:rotate(-4deg);z-index:6">
 <img src="../assets/box/cut/cookie.png" style="width:26px;left:50px;top:30px;transform:rotate(10deg);z-index:7">
 <div class="front"></div><div class="tag"><i>для</i>Максима</div></div>
<div class="t"><b>хайкинг бокс</b><small>еда и вода на весь хайк в одной коробке</small></div><button class="btn">что внутри</button></div>

<h3>B · вид сверху</h3>
<div class="plate"><div class="pic"><div class="top">
 <img src="../assets/box/cut/roll.png" style="width:40px;left:-4px;top:-6px;transform:rotate(-20deg)">
 <img src="../assets/box/cut/water.png" style="height:56px;left:34px;top:-8px;transform:rotate(70deg)">
 <img src="../assets/box/cut/bar.png" style="width:46px;left:-2px;top:24px;transform:rotate(8deg)">
 <img src="../assets/box/cut/cookie.png" style="width:26px;left:38px;top:26px;transform:rotate(-12deg)">
 <img src="../assets/box/cut/sticks.png" style="height:30px;left:12px;top:34px;transform:rotate(-30deg)">
</div><div class="tag"><i>для</i>Максима</div></div>
<div class="t"><b>хайкинг бокс</b><small>еда и вода на весь хайк в одной коробке</small></div><button class="btn">что внутри</button></div>

<h3>крупно</h3>
<div class="big">
 <div class="pic">
 <div class="inner"></div>
 <img src="../assets/box/cut/water.png" style="height:44px;left:10px;top:0;transform:rotate(-6deg);z-index:2">
 <img src="../assets/box/cut/shake.png" style="height:42px;left:50px;top:2px;transform:rotate(7deg);z-index:2">
 <img src="../assets/box/cut/chips.png" style="height:36px;left:26px;top:6px;transform:rotate(-3deg);z-index:3">
 <img src="../assets/box/cut/roll.png" style="width:34px;left:6px;top:22px;transform:rotate(-14deg);z-index:5">
 <img src="../assets/box/cut/sticks.png" style="height:32px;left:44px;top:16px;transform:rotate(8deg);z-index:4">
 <img src="../assets/box/cut/bar.png" style="width:42px;left:20px;top:30px;transform:rotate(-4deg);z-index:6">
 <img src="../assets/box/cut/cookie.png" style="width:26px;left:50px;top:30px;transform:rotate(10deg);z-index:7">
 <div class="front"></div><div class="tag"><i>для</i>Максима</div></div>
</div>
</body></html>
