  const N=ng.selectAll('g').data(shown,d=>d.id).join(enter=>{const g=enter.append('g').style('cursor','pointer');g.append('circle');g.append('text').attr('text-anchor','middle').attr('dy','.35em').attr('font-size',10).attr('font-weight',700).attr('fill','#0e141b');return g;});
  N.select('circle').attr('r',d=>6+Math.sqrt(d.h)*2.6).attr('fill',color);
  N.select('text').text(d=>d.i);
  N.on('click',(e,d)=>{e.stopPropagation();sel=d.id;focus(L,N,links,d);});
  svg.on('click',()=>{sel=null;L.attr('stroke','#9fb3c8').attr('stroke-opacity',d=>Math.min(.12+d.w*.1,.7));N.attr('opacity',1);document.getElementById('info').innerHTML='нажми на точку – покажу, с кем человек знаком через хайки. размер точки – сколько у него хайков';});
  N.call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y;}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  sim=d3.forceSimulation(shown).force('link',d3.forceLink(links).id(d=>d.id).distance(d=>60/Math.sqrt(d.w)).strength(d=>Math.min(.05+d.w*.08,.6)))
    .force('charge',d3.forceManyBody().strength(-70)).force('center',d3.forceCenter(W/2,H/2+40)).force('col',d3.forceCollide(d=>8+Math.sqrt(d.h)*2.6))
    .on('tick',()=>{L.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);N.attr('transform',d=>`translate(${d.x},${d.y})`);});
}
function focus(L,N,links,d){
  const nb=new Set([d.id]); let strong=0;
  links.forEach(l=>{if(l.source.id===d.id||l.target.id===d.id){nb.add(l.source.id);nb.add(l.target.id);if(l.w>=2)strong++;}});
  L.attr('stroke',l=>(l.source.id===d.id||l.target.id===d.id)?'#d9fd19':'#9fb3c8').attr('stroke-opacity',l=>(l.source.id===d.id||l.target.id===d.id)?.9:.04);
  N.attr('opacity',n=>nb.has(n.id)?1:.15);
  document.getElementById('info').innerHTML=`<b>${d.i}</b> · ${d.h} ${d.h%10===1&&d.h%100!==11?'хайк':(d.h%10>=2&&d.h%10<=4&&(d.h%100<12||d.h%100>14)?'хайка':'хайков')} · знаком с <b>${nb.size-1}</b> людьми через хайки, с ${strong} – больше одного раза`;
}
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-w]').forEach(x=>x.classList.remove('on'));b.classList.add('on');minW=+b.dataset.w;draw();});
document.getElementById('org').onclick=e=>{hideOrg=!hideOrg;e.target.classList.toggle('on',hideOrg);draw();};
draw();
</script></body></html>
