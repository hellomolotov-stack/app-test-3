<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

h2 { font-size: 15px; font-weight: 600; padding: 16px 16px 8px; color: #ccc; }
.card { margin: 0 16px 24px; border-radius: 12px; overflow: hidden; aspect-ratio: 1/1; position: relative; }
.map { width: 100%; height: 100%; }
.label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); color: #aaa; font-size: 11px; padding: 3px 8px; border-radius: 6px; z-index: 10; pointer-events: none; }

  <div class="label">Satellite B&W + 3D terrain</div>
</div>

.443734,34.091887],[44.443605,34.091930],[44.443519,34.092123],[44.443434,34.092166],[44.443369,34.092273],[44.443283,34.092295],[44.442940,34.092617],[44.442511,34.092595],[44.442361,34.092788],[44.442404,34.092917]];
const LAKE = [44.457771, 34.088326];

function hvKm(a1,o1,a2,o2){const R=6371,dLa=(a2-a1)*Math.PI/180,dLo=(o2-o1)*Math.PI/180;const a=Math.sin(dLa/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
let ni=0,best=Infinity;
for(let k=0;k<ROUTE.length;k++){const d=hvKm(ROUTE[k][0],ROUTE[k][1],LAKE[0],LAKE[1]);if(d<best){best=d;ni=k;}}
const truncated = [LAKE].concat(ROUTE.slice(ni));
const lineGeoJSON = {type:'Feature',geometry:{type:'LineString',coordinates:truncated.map(c=>[c[1],c[0]])}};

const map = new maplibregl.Map({
    container: 'map1',
    style: {
        version: 8,
        sources: {
            'satellite': {
                type: 'raster',
                tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                tileSize: 256,
                maxzoom: 18
            }
        },
        layers: [{
            id: 'satellite-layer',
            type: 'raster',
            source: 'satellite',
            paint: { 'raster-brightness-max': 0.7, 'raster-contrast': 0.15, 'raster-saturation': -1 }
        }]
    },
    center: [34.0893, 44.4550],
    zoom: 13.2,
    pitch: 60,
    bearing: -20,
    maxPitch: 80,
    attributionControl: false
});

map.on('load', () => {
    map.addSource('dem', {
        type: 'raster-dem',
        tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
        tileSize: 256,
        encoding: 'terrarium',
        maxzoom: 15
    });
    map.setTerrain({ source: 'dem', exaggeration: 1.8 });
    map.setSky({ 'sky-color': '#0A0B09', 'horizon-color': '#1a1a1a', 'fog-color': '#0A0B09' });

    map.addSource('route', { type: 'geojson', data: lineGeoJSON });
    map.addLayer({
        id: 'route-glow',
        type: 'line',
        source: 'route',
        paint: { 'line-color': '#D9FD19', 'line-width': 7, 'line-opacity': 0.35, 'line-blur': 5 }
    });
    map.addLayer({
        id: 'route-line',
        type: 'line',
        source: 'route',
        paint: { 'line-color': '#D9FD19', 'line-width': 3.5, 'line-opacity': 0.95 },
        layout: { 'line-cap': 'round', 'line-join': 'round' }
    });

    const startCoord = truncated[truncated.length - 1];
    const startEl = document.createElement('div');
    startEl.style.cssText = 'width:10px;height:10px;background:#D9FD19;border-radius:50%;box-shadow:0 0 6px #D9FD19;';
    new maplibregl.Marker({ element: startEl }).setLngLat([startCoord[1], startCoord[0]]).addTo(map);

    const lakeEl = document.createElement('div');
    lakeEl.style.cssText = 'width:12px;height:12px;background:#4FC3F7;border-radius:50%;box-shadow:0 0 8px #4FC3F7;';
    new maplibregl.Marker({ element: lakeEl }).setLngLat([LAKE[1], LAKE[0]]).addTo(map);
});
</script>
