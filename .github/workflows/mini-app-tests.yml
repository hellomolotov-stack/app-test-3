name: Mini App tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-checks:
    name: Mini App release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Mini App
        run: npm run build
      - name: Run portable tests
        run: |
          set -e
          for test_file in \
            hike-waitlist.cjs \
            profile-membership.cjs \
            hof-modes.cjs \
            startup-state.cjs \
            ticket-pricing.cjs \
            ticket-recovery.cjs
          do
            echo "==> $test_file"
            node tests/run.cjs --no-build "$test_file"
          done

  full-suite:
    name: Mini App full suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright without changing package manifests
        run: npm install --no-save --package-lock=false playwright@1.65.1
      - name: Install Google Chrome
        run: npx playwright install --with-deps chrome
      - name: Run full test suite
        run: npm test
